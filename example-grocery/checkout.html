<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Checkout - Example Grocery Store</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light p-3">
        <a class="navbar-brand" href="#">example grocery store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="fruitsandveg.html">Fruits and Vegetables</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dairy.html">Dairy</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="misc.html">Others</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Checkout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container my-5">
        <h1>Checkout</h1>
        <div id="cartItems"></div>
        <div id="totalCost" class="mt-4"></div>
        <button id="finalizePurchase" class="btn btn-success mt-3">Finalize Purchase</button>
    </div>

    <script>
        function displayCart() {
            var cart = JSON.parse(localStorage.getItem('cart'));
            var cartItemsDiv = document.getElementById('cartItems');
            var total = 0;

            if (cart) {
                var items = Object.keys(cart).map(function(key) {
                    var itemTotal = (cart[key].cost || 0) * cart[key].quantity;
                    total += itemTotal;
                    return `<p>${key}: ${cart[key].quantity} from ${cart[key].farm} ($${(cart[key].cost || "N/A").toFixed(2)} each) - Total: $${itemTotal.toFixed(2)}</p>`;
                }).join("");
                cartItemsDiv.innerHTML = items;
            } else {
                cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
            }

            document.getElementById('totalCost').innerHTML = `<h4>Total Cost: $${total.toFixed(2)}</h4>`;
        }

        document.getElementById('finalizePurchase').addEventListener('click', function() {
            alert("Thank you for your purchase!");
            localStorage.removeItem('cart');
            displayCart();
        });

        displayCart();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
